<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ПЕРЕКУП</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b10;color:#f5f7fa;font-family:Arial,sans-serif}.app{max-width:1050px;margin:auto;padding:12px}.top{position:sticky;top:0;background:#080b10ed;backdrop-filter:blur(12px);z-index:5;padding:7px 0 10px}.brand{display:flex;justify-content:space-between;align-items:center}.brand h1{margin:0}.cash{color:#35dc7d;font-weight:900;font-size:19px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.stat,.card{background:#131a23;border:1px solid #293442;border-radius:16px;padding:13px}.stat span,.muted{color:#8d99a9;font-size:12px}.stat b{display:block;margin-top:3px}.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tabs button{white-space:nowrap}button{border:0;border-radius:10px;padding:11px 13px;background:#293544;color:#fff;font-weight:800}button:disabled{opacity:.35}.active,.primary{background:#35dc7d!important;color:#04130a!important}.page{display:none}.page.active{display:block}.hero{margin-bottom:10px;background:linear-gradient(135deg,#182435,#111820)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}.carart{height:160px;border-radius:13px;overflow:hidden;background:#101923;margin-bottom:10px}.carart svg{width:100%;height:100%}.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #252e39}.gold{color:#ffc857}.green{color:#35dc7d}.red{color:#ff5964}.tag{display:inline-block;background:#26313d;border-radius:7px;padding:4px 7px;font-size:11px;margin:3px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.wide{width:100%;margin-top:8px}.bar{height:8px;background:#26303b;border-radius:20px;overflow:hidden}.fill{height:100%;background:#35dc7d}.log{max-height:350px;overflow:auto}.log div{padding:8px;border-bottom:1px solid #252e39}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:flex-end;padding:12px}.modal.show{display:flex}.modalbox{background:#151e29;border:1px solid #334152;border-radius:20px;padding:18px;width:min(650px,100%)}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.carart{height:140px}}
</style></head><body><div class="app">
<header class="top"><div class="brand"><h1>🚘 ПЕРЕКУП</h1><div class="cash" id="cash">$10 000</div></div><div class="muted">Купи → отремонтируй → продай дороже</div>
<div class="stats"><div class="stat"><span>РЕПУТАЦИЯ</span><b id="rep">⭐ 1</b></div><div class="stat"><span>ГАРАЖ</span><b id="gs">0/2</b></div><div class="stat"><span>ПРОДАНО</span><b id="ss">0</b></div><div class="stat"><span>ДЕНЬ</span><b id="day">1</b></div></div></header>
<nav class="tabs" id="tabs"><button class="active" data-page="market">Рынок</button><button data-page="garage">Гараж</button><button data-page="business">Бизнес</button><button data-page="history">История</button></nav>
<section class="page active" id="market"><div class="card hero"><h2>Рынок</h2><div class="muted">У каждой машины есть состояние, дефекты и ограниченный торг.</div></div><div class="grid" id="marketGrid"></div></section>
<section class="page" id="garage"><div class="card hero"><h2>Гараж</h2><div class="muted">Ремонт поднимает состояние максимум до 100%.</div></div><div class="grid" id="garageGrid"></div></section>
<section class="page" id="business"><div class="grid"><div class="card"><h2>Бизнес · уровень <span id="level">1</span></h2><div class="bar"><div class="fill" id="xpfill"></div></div><p class="muted" id="xptext"></p></div><div class="card"><h3>📦 Гараж</h3><p class="muted" id="upinfo"></p><button class="primary wide" id="upbtn"></button></div><div class="card"><h3>🛠️ СТО</h3><p class="muted" id="svinfo"></p><button class="primary wide" id="svbtn"></button></div><div class="card"><h3>📣 Реклама</h3><p class="muted">+5% к следующей продаже.</p><button class="primary wide" id="adbtn"></button></div></div></section>
<section class="page" id="history"><div class="card"><h2>История</h2><div class="log" id="historyLog"></div></div></section></div>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<script>
const DB=[["Lada Granta","Россия",2018,3200,5200],["Renault Logan","Франция",2017,4100,6500],["Volkswagen Passat B7","Германия",2013,5700,8500],["Honda Civic","Япония",2014,6200,9300],["Mazda 6","Япония",2015,7200,10800],["BMW 3 Series","Германия",2014,7600,11600],["Audi A4","Германия",2015,8200,12500],["Mercedes C-Class","Германия",2015,9000,14000],["Toyota Camry","Япония",2016,9800,14800],["BMW 5 Series","Германия",2015,11000,16800],["Skoda Octavia","Чехия",2018,6900,9900],["Kia Optima","Корея",2017,7600,11200]];
let S=JSON.parse(localStorage.getItem("perekup_v4")||"null")||{money:10000,rep:1,sold:0,day:1,level:1,xp:0,capacity:2,service:0,ad:0,garage:[],market:[],history:[]};
const $=x=>document.getElementById(x),F=n=>"$"+Math.round(n).toLocaleString("en-US");
function save(){localStorage.setItem("perekup_v4",JSON.stringify(S))}function log(x){S.history.unshift(x);S.history=S.history.slice(0,80)}
function make(){let b=DB[Math.floor(Math.random()*DB.length)],q=Math.round(55+Math.random()*45),issues=["Кузов","Ходовая"];if(q<75)issues.push("Скрытый дефект");return{id:Date.now()+Math.random(),name:b[0],country:b[1],year:b[2],base:b[3],market:b[4],condition:q,price:Math.round(b[4]*(.62+Math.random()*.18)),repair:Math.round((100-q)*b[3]*.014+b[3]*.035),issues,diagnosed:false,repaired:false,haggles:0,maxHaggles:2+Math.floor(Math.random()*2)}}
function art(c){let colors=["#3d8bfd","#e65353","#d8a927","#4ebc7a","#8e9cff","#c7ccd4"],col=colors[c.name.length%colors.length];return`<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg"><rect width="640" height="280" fill="#111923"/><ellipse cx="320" cy="225" rx="240" ry="25" fill="#000" opacity=".45"/><path d="M95 198l35-57q10-15 60-18l55-49q15-12 45-12h105q32 0 52 20l50 43q38 4 60 35l20 38z" fill="${col}" stroke="#a9b4c0" stroke-width="4"/><path d="M257 80h125q25 0 40 15l35 30H220z" fill="#202b38" stroke="#9da8b5" stroke-width="3"/><circle cx="180" cy="202" r="38" fill="#080b10" stroke="#8c98a5" stroke-width="8"/><circle cx="180" cy="202" r="15" fill="#bac3cc"/><circle cx="490" cy="202" r="38" fill="#080b10" stroke="#8c98a5" stroke-width="8"/><circle cx="490" cy="202" r="15" fill="#bac3cc"/><rect x="113" y="173" width="30" height="15" rx="4" fill="#fff0a8"/><rect x="525" y="173" width="30" height="15" rx="4" fill="#ff5964"/></svg>`}
function mcard(c){return`<div class="card"><div class="carart">${art(c)}</div><h3>${c.name}</h3><div class="muted">${c.country} · ${c.year} · состояние <b>${c.condition}%</b></div><div class="row"><span>Продавец</span><b>${F(c.price)}</b></div><div class="row"><span>Рынок</span><b class="gold">${F(c.market)}</b></div><div class="row"><span>Ремонт</span><b>${F(c.repair)}</b></div><div>${(c.diagnosed?c.issues:["Неизвестно"]).map(x=>'<span class="tag">⚠ '+x+'</span>').join("")}</div><div class="actions"><button data-a="diag" data-id="${c.id}">🔍 Осмотр</button><button data-a="hag" data-id="${c.id}" ${c.haggles>=c.maxHaggles?"disabled":""}>🤝 Торг · ${c.maxHaggles-c.haggles}</button></div><button class="primary wide" data-a="buy" data-id="${c.id}">Купить · ${F(c.price)}</button></div>`}
function gcard(c){let rc=Math.round(c.repair*(1-S.service*.07)),sale=Math.round(c.market*(c.repaired?1.03:.84)*(S.ad?1.05:1));return`<div class="card"><div class="carart">${art(c)}</div><h3>${c.name}</h3><div class="muted">Состояние ${c.condition}%</div><div class="row"><span>Покупка</span><b>${F(c.price)}</b></div><div class="row"><span>Ремонт</span><b>${F(rc)}</b></div><div class="row"><span>Продажа</span><b class="gold">${F(sale)}</b></div><p>${c.repaired?'<span class="green">✓ Готово</span>':'<span class="red">⚠ Нужен ремонт</span>'}</p><div class="actions"><button data-a="repair" data-id="${c.id}" ${c.repaired?"disabled":""}>🔧 Ремонт</button><button class="primary" data-a="sell" data-id="${c.id}">Продать</button></div></div>`}
function render(){cash.textContent=F(S.money);rep.textContent="⭐ "+S.rep;gs.textContent=S.garage.length+"/"+S.capacity;ss.textContent=S.sold;day.textContent=S.day;level.textContent=S.level;let need=3+S.level*2;xpfill.style.width=Math.min(100,S.xp/need*100)+"%";xptext.textContent=S.xp+" / "+need+" XP";let uc=2200+S.capacity*1700;upinfo.textContent="Мест: "+S.capacity+" · следующее улучшение дорожает.";upbtn.textContent="Расширить · "+F(uc);let sc=1700+S.service*1300;svinfo.textContent="Уровень СТО: "+S.service+"/5 · скидка "+S.service*7+"%";svbtn.textContent=S.service>=5?"Максимум":"Улучшить · "+F(sc);adbtn.textContent=S.ad?"Реклама активна":"Реклама · $600";marketGrid.innerHTML=S.market.map(mcard).join("");garageGrid.innerHTML=S.garage.length?S.garage.map(gcard).join(""):'<div class="card">Гараж пуст</div>';historyLog.innerHTML=S.history.length?S.history.map(x=>"<div>"+x+"</div>").join(""):'<div>История пуста</div>';save()}
function close(){modal.classList.remove("show")}function show(t){modalbox.innerHTML=t;modal.classList.add("show")}
tabs.addEventListener("click",e=>{let b=e.target.closest("[data-page]");if(!b)return;document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));$(b.dataset.page).classList.add("active")});
document.addEventListener("click",e=>{let b=e.target.closest("[data-a]");if(!b)return;let id=b.dataset.id,c,i;b.dataset.a==="diag"&&(c=S.market.find(x=>x.id==id),c.diagnosed=true,log("🔍 Осмотр "+c.name),render(),show("<h2>Диагностика</h2><p>"+c.name+" — "+c.condition+"%</p><p>"+c.issues.join(" • ")+"</p><button class='primary wide' onclick='close()'>Закрыть</button>"));if(b.dataset.a==="hag"){c=S.market.find(x=>x.id==id);if(c.haggles<c.maxHaggles){let floor=Math.max(Math.round(c.market*.58),Math.round(c.price*.72)),cut=Math.max(40,Math.round((c.price-floor)*.5));c.price=Math.max(floor,c.price-cut);c.haggles++;log("🤝 Торг "+c.name+" −"+F(cut));render()}}if(b.dataset.a==="buy"){if(S.garage.length>=S.capacity)return alert("Гараж заполнен");i=S.market.findIndex(x=>x.id==id);c=S.market[i];if(S.money<c.price)return alert("Не хватает денег");S.money-=c.price;S.garage.push(c);S.market.splice(i,1);log("💰 Куплен "+c.name+" за "+F(c.price));while(S.market.length<6)S.market.push(make());render()}if(b.dataset.a==="repair"){c=S.garage.find(x=>x.id==id);let cost=Math.round(c.repair*(1-S.service*.07));if(c.condition>=100){c.repaired=true}else if(S.money>=cost){S.money-=cost;c.condition=100;c.repaired=true;log("🔧 "+c.name+" отремонтирован до 100%")}else return alert("Не хватает денег");render()}if(b.dataset.a==="sell"){i=S.garage.findIndex(x=>x.id==id);c=S.garage[i];let rc=c.repaired?Math.round(c.repair*(1-S.service*.07)):0,sale=Math.round(c.market*(c.repaired?1.03:.84)*(S.ad?1.05:1)),profit=sale-c.price-rc;S.money+=sale;S.garage.splice(i,1);S.sold++;S.day++;S.ad=0;S.xp++;if(profit>700)S.rep=Math.min(10,S.rep+1);log("💵 Продан "+c.name+" за "+F(sale)+" · "+(profit>=0?"прибыль ":"убыток ")+F(profit));let need=3+S.level*2;if(S.xp>=need){S.xp-=need;S.level++;S.capacity++;log("🏆 Новый уровень!")}while(S.market.length<6)S.market.push(make());render()}});
upbtn.onclick=()=>{let c=2200+S.capacity*1700;if(S.money<c)return alert("Не хватает денег");S.money-=c;S.capacity++;log("🏢 Гараж расширен");render()};svbtn.onclick=()=>{if(S.service>=5)return alert("Максимум");let c=1700+S.service*1300;if(S.money<c)return alert("Не хватает денег");S.money-=c;S.service++;log("🛠️ СТО улучшено");render()};adbtn.onclick=()=>{if(S.ad)return alert("Реклама уже активна");if(S.money<600)return alert("Не хватает денег");S.money-=600;S.ad=1;log("📣 Запущена реклама");render()};modal.onclick=e=>{if(e.target===modal)close()};
while(S.market.length<6)S.market.push(make());render();
</script></body></html>
